<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>posteur — connexion Instagram</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 48px auto; padding: 0 20px; color: #1d1d1f; }
  h1 { font-size: 1.4rem; }
  #code { font-family: ui-monospace, Consolas, monospace; font-size: 0.95rem; word-break: break-all;
          background: #f2f2f4; border-radius: 8px; padding: 14px; margin: 16px 0; }
  button { font-size: 1rem; padding: 10px 18px; border-radius: 8px; border: 0; background: #1d1d1f; color: #fff; cursor: pointer; }
  .ko { color: #b00020; }
  .petit { color: #666; font-size: 0.9rem; margin-top: 24px; }
</style>
</head>
<body>
<h1 id="titre">Connexion Instagram de posteur</h1>
<p id="texte">Copie ce code et colle-le dans PowerShell, à la question « Code : ».</p>
<div id="code">—</div>
<button id="copier" type="button">Copier le code</button>
<p class="petit">Copy this code and paste it into the posteur window. This page only displays the authorization code
returned by Instagram; it stores and sends nothing.</p>
<script>
  var q = new URLSearchParams(location.search);
  var code = (q.get("code") || "").split("#")[0];
  var zone = document.getElementById("code");
  if (q.get("error")) {
    document.getElementById("titre").textContent = "Connexion refusée";
    document.getElementById("titre").className = "ko";
    document.getElementById("texte").textContent = q.get("error_description") || q.get("error");
    zone.style.display = "none";
    document.getElementById("copier").style.display = "none";
  } else if (code) {
    zone.textContent = code;
  } else {
    document.getElementById("texte").textContent = "Aucun code dans l'adresse : relance « python posteur.py connecter » et accepte l'accès sur Instagram.";
    document.getElementById("copier").style.display = "none";
  }
  document.getElementById("copier").onclick = function () {
    navigator.clipboard.writeText(code).then(function () {
      document.getElementById("copier").textContent = "Copié ✓";
    });
  };
</script>
</body>
</html>
